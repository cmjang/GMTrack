[project]
name = "gmtrack"
version = "0.1.0"
description = "Highly dynamic humanoid whole-body motion tracking on the Unitree G1"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mjlab>=1.5.3",
    # Declared directly even though mjlab already pulls it in: `[tool.uv.sources]`
    # only rewrites dependencies this project declares itself, so without this line
    # the local editable checkout in third_party/ is silently ignored and rsl-rl is
    # installed from PyPI instead.
    "rsl-rl-lib==5.4.0",
    # Declared directly so `[tool.uv.sources]` can pin it to the CUDA index
    # unconditionally. See the note in `[tool.uv]`.
    "torch>=2.7.0",
]

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14.14",
    "pytest>=8.0",
    "ipdb>=0.13.13",
]

[tool.ruff]
indent-width = 2
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.entry-points."mjlab.tasks"]
gmtrack = "gmtrack"

[tool.uv]
# `[tool.uv]` is project-local and is NOT inherited from mjlab, so mjlab's torch
# index wiring has to be repeated here verbatim or we silently get CPU wheels.
#
# torch is pinned to the CUDA index UNCONDITIONALLY -- deliberately not behind an
# extra. `uv run` re-syncs before executing, so with an extra-gated source a bare
# `uv run pytest` silently swaps the CUDA-12.8 build for whatever the default index
# serves (currently cu130). The next CUDA call then fails with "NVIDIA driver is too
# old" on a machine whose driver never changed -- about as misleading as errors get.
# There is no CPU variant on purpose: mujoco-warp only runs on GPU, so a CPU install
# could not train anyway.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# Local editable checkout of rsl-rl v5.4.0 so we can read/step through the source
# we subclass in `src/gmtrack/rsl_rl/`. Must stay at 5.4.0 (mjlab pins it exactly).
rsl-rl-lib = { path = "third_party/rsl_rl", editable = true }
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
torch = { index = "pytorch-cu128" }
